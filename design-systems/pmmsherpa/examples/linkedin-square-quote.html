<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PMM Sherpa · LinkedIn Square · Quote (Variant A)</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: #e7eaf0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 40px;
  }

  .frame {
    width: 1080px;
    height: 1080px;
    box-shadow: 0 16px 60px rgba(10,22,40,0.18);
    overflow: hidden;
  }

  .card {
    width: 1080px;
    height: 1080px;
    padding: 88px 96px;
    background: linear-gradient(180deg, #f8f9fd 0%, #f0f3fa 100%);
    color: #191c1e;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .wordmark {
    display: flex; align-items: center; gap: 16px;
    font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: #191c1e;
  }
  .logo { width: 56px; height: 56px; }
  .eyebrow {
    font-size: 18px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: #0058be;
  }

  .body {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center;
    margin-top: 24px;
  }
  .quote {
    font-size: 60px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.18;
    color: #191c1e;
    max-width: 820px;
  }
  .quote::before {
    content: "“";
    color: #0058be;
    font-size: 120px;
    line-height: 0;
    margin-right: 8px;
    position: relative;
    top: 28px;
  }
  .attribution {
    margin-top: 36px;
    font-size: 24px;
    font-weight: 700;
    color: #4a4f57;
  }
  .attribution span {
    color: #5f6368;
    font-weight: 500;
  }

  .byline {
    display: flex; align-items: center; gap: 20px;
    padding-top: 28px;
    border-top: 1px solid rgba(0, 88, 190, 0.12);
  }
  .avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c7d4e8, #a4b8d6);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: white;
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }
  .who { font-size: 22px; font-weight: 600; color: #191c1e; line-height: 1.3; }
  .who span { display: block; font-size: 18px; color: #5f6368; font-weight: 500; }
</style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="top">
        <div class="wordmark">
          <svg class="logo" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0058be"/>
                <stop offset="100%" stop-color="#2170e4"/>
              </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="256" fill="url(#lg)"/>
            <polyline points="89.33,389.33 172.67,222.67 256,322.67 322.67,156 422.67,389.33"
              fill="none" stroke="white" stroke-width="37"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          PMM Sherpa
        </div>
        <div class="eyebrow">From a user</div>
      </div>

      <div class="body">
        <div class="quote">Sherpa is the first PMM tool that doesn't sound like every other AI tool.</div>
        <div class="attribution">Shreyas Sriram <span>· Senior PMM, Highspot</span></div>
      </div>

      <div class="byline">
        <div class="avatar">AR</div>
        <div class="who">Abhishek Ratna<span>Founder · PMM Sherpa</span></div>
      </div>
    </div>
  </div>
</body>
</html>
