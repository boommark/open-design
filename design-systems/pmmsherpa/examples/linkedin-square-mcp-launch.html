<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PMM Sherpa · LinkedIn Square · MCP Launch (Variant A)</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: #e7eaf0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 40px;
  }

  .frame {
    width: 1080px;
    height: 1080px;
    box-shadow: 0 16px 60px rgba(10,22,40,0.18);
    overflow: hidden;
  }

  .card {
    width: 1080px;
    height: 1080px;
    padding: 88px 96px;
    background: linear-gradient(180deg, #f8f9fd 0%, #f0f3fa 100%);
    color: #191c1e;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }

  /* TOP */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .wordmark {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #191c1e;
  }
  .logo { width: 56px; height: 56px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #059669;
    padding: 10px 18px;
    background: rgba(16, 185, 129, 0.05);
    border: 1px solid rgba(16, 185, 129, 0.35);
    border-radius: 999px;
  }
  .eyebrow .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.7);
  }

  /* CENTER */
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-top: 16px;
  }

  .headline {
    font-size: 76px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.08;
    color: #191c1e;
    max-width: 880px;
  }
  .headline .accent {
    background: linear-gradient(135deg, #0058be 0%, #2170e4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* CLIENT STRIP — mirrors MCPSection chip styling from staging.pmmsherpa.com */
  .clients {
    display: flex;
    align-items: flex-start;
    gap: 36px;
    margin-top: 72px;
  }
  .client {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .client .chip {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid rgba(0, 88, 190, 0.06);
  }
  .client .chip img {
    width: 56px;
    height: 56px;
    object-fit: contain;
  }
  .client .name {
    font-size: 18px;
    font-weight: 600;
    color: #4a4f57;
    letter-spacing: -0.005em;
  }

  /* Brand-tint backgrounds matching the live site */
  .client.claude  .chip { background: #fbeee5; }
  .client.gpt     .chip { background: #f1f5f4; }
  .client.code    .chip { background: #fbeee5; }
  .client.antigrav .chip { background: #f3edff; }

  /* BYLINE */
  .byline {
    display: flex;
    align-items: center;
    gap: 18px;
    padding-top: 28px;
    border-top: 1px solid rgba(0, 88, 190, 0.12);
  }
  .byline-logo { width: 48px; height: 48px; flex-shrink: 0; }
  .who {
    font-size: 22px;
    font-weight: 700;
    color: #191c1e;
    line-height: 1.3;
  }
  .who span {
    display: block;
    font-size: 18px;
    color: #5f6368;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="card">

      <!-- TOP: wordmark + launch eyebrow -->
      <div class="top">
        <div class="wordmark">
          <svg class="logo" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="lg-mountain" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0058be"/>
                <stop offset="100%" stop-color="#2170e4"/>
              </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="256" fill="url(#lg-mountain)"/>
            <polyline points="89.33,389.33 172.67,222.67 256,322.67 322.67,156 422.67,389.33"
              fill="none" stroke="white" stroke-width="37"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          PMM Sherpa
        </div>
        <div class="eyebrow"><span class="dot"></span>MCP is live</div>
      </div>

      <!-- CENTER: headline -->
      <div class="body">
        <div class="headline">
          Your AI tools and agents<br/>
          just got <span class="accent">a senior PMM.</span>
        </div>

        <!-- CLIENT STRIP -->
        <div class="clients">
          <div class="client claude">
            <div class="chip"><img src="assets/clients/claude.svg" alt="Claude"/></div>
            <div class="name">Claude</div>
          </div>
          <div class="client gpt">
            <div class="chip"><img src="assets/clients/chatgpt.png" alt="ChatGPT"/></div>
            <div class="name">ChatGPT</div>
          </div>
          <div class="client code">
            <div class="chip"><img src="assets/clients/claude-code.png" alt="Claude Code"/></div>
            <div class="name">Claude Code</div>
          </div>
          <div class="client antigrav">
            <div class="chip"><img src="assets/clients/antigravity.png" alt="Antigravity"/></div>
            <div class="name">Antigravity</div>
          </div>
        </div>
      </div>

      <!-- BOTTOM: product byline with credibility line -->
      <div class="byline">
        <svg class="byline-logo" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="lg-byline" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0058be"/>
              <stop offset="100%" stop-color="#2170e4"/>
            </linearGradient>
          </defs>
          <circle cx="256" cy="256" r="256" fill="url(#lg-byline)"/>
          <polyline points="89.33,389.33 172.67,222.67 256,322.67 322.67,156 422.67,389.33"
            fill="none" stroke="white" stroke-width="37"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="who">pmmsherpa.com<span>38,000+ curated chunks of PMM wisdom</span></div>
      </div>

    </div>
  </div>
</body>
</html>
