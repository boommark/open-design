<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PMM Sherpa · LinkedIn Square · Stat (Variant B)</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: #e7eaf0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 40px;
  }

  .frame {
    width: 1080px;
    height: 1080px;
    box-shadow: 0 16px 60px rgba(10,22,40,0.18);
    overflow: hidden;
  }

  .card {
    width: 1080px;
    height: 1080px;
    padding: 88px 96px;
    background:
      radial-gradient(1200px 800px at 80% -10%, rgba(33, 112, 228, 0.35) 0%, transparent 60%),
      radial-gradient(900px 700px at 0% 110%, rgba(90, 156, 245, 0.18) 0%, transparent 55%),
      linear-gradient(160deg, #0a1628 0%, #0f1d35 100%);
    color: white;
    position: relative;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
  }
  .card > * { position: relative; z-index: 1; }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .wordmark {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: white;
  }
  .logo { width: 56px; height: 56px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #5a9cf5;
    padding: 10px 18px;
    background: rgba(90, 156, 245, 0.12);
    border: 1px solid rgba(90, 156, 245, 0.24);
    border-radius: 999px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #5a9cf5;
    box-shadow: 0 0 16px #5a9cf5;
  }

  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-top: 8px;
  }
  .stat {
    font-size: 320px;
    font-weight: 900;
    letter-spacing: -0.06em;
    line-height: 0.85;
    background: linear-gradient(180deg, #ffffff 0%, #5a9cf5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-label {
    margin-top: 28px;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: white;
    line-height: 1.15;
    max-width: 800px;
  }
  .stat-label em {
    font-style: normal;
    color: #5a9cf5;
  }

  .byline {
    display: flex;
    align-items: center;
    gap: 20px;
    padding-top: 28px;
    border-top: 1px solid rgba(255, 255, 255, 0.10);
  }
  .avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0058be, #2170e4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: white;
    letter-spacing: -0.02em;
    border: 2px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
  }
  .who { font-size: 22px; font-weight: 700; color: white; line-height: 1.3; }
  .who span { display: block; font-size: 18px; color: #8e9199; font-weight: 500; }
</style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="top">
        <div class="wordmark">
          <svg class="logo" viewBox="0 0 512 512">
            <circle cx="256" cy="256" r="256" fill="white"/>
            <defs>
              <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0058be"/>
                <stop offset="100%" stop-color="#2170e4"/>
              </linearGradient>
            </defs>
            <polyline points="89.33,389.33 172.67,222.67 256,322.67 322.67,156 422.67,389.33"
              fill="none" stroke="url(#lg)" stroke-width="37"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          PMM Sherpa
        </div>
        <div class="eyebrow"><span class="dot"></span>By the numbers</div>
      </div>

      <div class="body">
        <div class="stat">38K</div>
        <div class="stat-label">chunks. <em>9 knowledge layers.</em><br/>One PMM advisor that actually read the books.</div>
      </div>

      <div class="byline">
        <div class="avatar">AR</div>
        <div class="who">Abhishek Ratna<span>Founder · PMM Sherpa</span></div>
      </div>
    </div>
  </div>
</body>
</html>
